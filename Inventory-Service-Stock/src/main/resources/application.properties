spring.application.name=Inventory-Service-Stock

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/garzonpro_inventory?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.main.banner-mode=off

logging.level.org.springframework.web=INFO
logging.level.com.ProyectoRestaurant.inventory=DEBUG