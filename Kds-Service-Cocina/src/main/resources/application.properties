server.port=8086
spring.application.name=kds-service

# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/garzonpro_kds?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate solo validará, Flyway creará las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Activación de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true