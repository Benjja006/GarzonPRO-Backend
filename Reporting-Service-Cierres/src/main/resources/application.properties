server.port=8089
spring.application.name=reporting-service

# Base de datos en singular
spring.datasource.url=jdbc:mysql://localhost:3306/garzonpro_reporting?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate SOLO validará, Flyway se encargará de crear la tabla
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.docker.compose.enabled=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true