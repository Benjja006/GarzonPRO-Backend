server.port=8084
spring.application.name=table-service

spring.datasource.url=jdbc:mysql://localhost:3306/garzonpro_table?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Cambia esto a 'update' solo para ESTA ejecución
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivamos Docker Compose por si acaso
spring.docker.compose.enabled=false

# Flyway (lo dejamos listo pero Hibernate mandará ahora)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true