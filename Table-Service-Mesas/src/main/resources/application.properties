server.port=8091
spring.application.name=table-service

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL dedicado para mesas)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/garzonpro_table?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ===================================================================
# HIBERNATE & FLYWAY
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===================================================================
# REGISTRO EN EUREKA (Conexión al ecosistema GarzonPro)
# ===================================================================
# URL de tu servidor de descubrimiento local
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=30