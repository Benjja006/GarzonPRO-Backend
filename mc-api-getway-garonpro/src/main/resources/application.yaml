server:
  port: 8080
spring:
  application:
    name: mc-api-getway-garonpro
  cloud:
    gateway:
      mvc:
        routes:
          - id: mc-AuthService
            uri: http://localhost:8081
            predicates:
              - Path=/auth/**
          - id: mc-UserService
            uri: http://localhost:8082
            predicates:
              - Path=/usuarios/**
          - id: mc-CatalogService
            uri: http://localhost:8083
            predicates:
              - Path=/catalog/**
          - id: inventory-service-stock
            uri: http://localhost:8084
            predicates:
              - Path=/inventory/stock/**
          - id: kds-service
            uri: http://localhost:8087
            predicates:
              - Path=/kds/**
          - id: order-service
            uri: http://localhost:8086
            predicates:
              - Path=/orders/**
          - id: payment-service
            uri: http://localhost:8088
            predicates:
              - Path=/payments/**
          - id: reporting-service
            uri: http://localhost:8090
            predicates:
              - Path=/reporting/**
          - id: table-service
            uri: http://localhost:8091
            predicates:
              - Path=/table/**
          - id: status-service
            uri: http://localhost:8089
            predicates:
              - Path=/status/**