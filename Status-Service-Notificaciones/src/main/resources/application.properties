server.port=8089
spring.application.name=status-service

# ===================================================================
# CONFIGURACI N DE BASE DE DATOS (Tus credenciales y URL originales)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/garzonpro_status?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# ===================================================================
# HIBERNATE & FLYWAY (Manteniendo tu formato de SQL limpio)
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===================================================================
# NUEVO: REGISTRO EN EUREKA (Conexi n al ecosistema GarzonPro)
# ===================================================================
# Apunta al servidor central de Eureka de tu proyecto
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=30