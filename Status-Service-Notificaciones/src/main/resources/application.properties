server.port=8088
spring.application.name=status-service

# Base de datos independiente para el servicio de notificaciones/estado
spring.datasource.url=jdbc:mysql://localhost:3306/garzonpro_status?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate SOLO validará, Flyway se encargará de crear la tabla
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.docker.compose.enabled=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true